name: National Reporter V23 FINAL PERMANENT - No Tabassum 5x Ever Again

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post even if duplicate'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - routine
          - breaking
          - clean_old
  push:
    branches: [ main ]

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies V23 FINAL
      run: |
        pip install -r requirements.txt
        pip install google-generativeai
        echo "V23 FINAL PERMANENT - Tabassum Begum 5x NEVER AGAIN - Reference perfect English+Roman"
    - name: Restore cache V23 FINAL NO TABASSUM
      uses: actions/cache@v4
      with:
        path: |
          output/last_posted.json
          output/posted_today.json
        key: v23-final-no-tabassum-${{ github.run_id }}-${{ github.run_number }}
        restore-keys: |
          v23-final-no-tabassum-
          v23-final-
    - name: Clean old cache if Tabassum present
      run: |
        echo "Cleaning any Tabassum from cache..."
        python3 - << 'PY'
        import json, pathlib
        blacklist = ["tabassum", "begum", "ball badminton", "tsa felicitates", "woman who married lover"]
        for path in ["output/last_posted.json", "output/posted_today.json"]:
            p = pathlib.Path(path)
            if p.exists():
                try:
                    data = json.loads(p.read_text(encoding='utf-8'))
                    before = len(data.get('titles', []))
                    def is_black(t):
                        l = t.lower()
                        return any(b in l for b in blacklist)
                    data['titles'] = [t for t in data.get('titles', []) if not is_black(t)]
                    data['headlines'] = [h for h in data.get('headlines', []) if not is_black(h)]
                    p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
                    print(f"Cleaned {path}: {before} -> {len(data['titles'])}")
                except Exception as e:
                    print(f"Failed clean {path}: {e}")
                    p.write_text('{"date": "2026-09-30", "titles": [], "headlines": []}', encoding='utf-8')
        PY
    - name: Check secrets V23
      run: |
        if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then echo "ERROR PAGE_ID"; exit 1; fi
        if [ -z "${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}" ]; then echo "ERROR TOKEN"; exit 1; fi
        echo "Secrets OK V23 FINAL"
        echo "Page 239472476226069 - Never expiring token nr_api_bot"
        if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then echo "GEMINI_API_KEY not set - using hardcoded specific (no generic)"; else echo "GEMINI_API_KEY set - Gemini enabled"; fi
    - name: Create .env V23 FINAL
      run: |
        cat > .env << EOL
        FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL=gpt-4o-mini
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL=gemini-1.5-flash
        EOL
        chmod 600 .env
    - name: Determine mode V23
      id: mode
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          if [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            echo "mode=breaking" >> $GITHUB_OUTPUT
            echo "is_routine=false" >> $GITHUB_OUTPUT
          else
            echo "mode=routine" >> $GITHUB_OUTPUT
            echo "is_routine=true" >> $GITHUB_OUTPUT
          fi
        else
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$INPUT_MODE" = "breaking" ]; then echo "mode=breaking" >> $GITHUB_OUTPUT; echo "is_routine=false" >> $GITHUB_OUTPUT
          elif [ "$INPUT_MODE" = "clean_old" ]; then echo "mode=clean_old" >> $GITHUB_OUTPUT; echo "is_routine=false" >> $GITHUB_OUTPUT
          else echo "mode=routine" >> $GITHUB_OUTPUT; echo "is_routine=true" >> $GITHUB_OUTPUT; fi
        fi
    - name: Run Breaking Check V23 FINAL NO TABASSUM
      if: steps.mode.outputs.is_routine == 'false' && steps.mode.outputs.mode != 'clean_old'
      run: |
        echo "V23 FINAL Breaking 15min - PERMANENT FIX Tabassum 5x NEVER AGAIN"
        echo "Blacklist: Tabassum Begum Ball Badminton, TSA Swimmers, Woman Married OYO"
        echo "Saves ALL bullet titles to avoid 5x repeat"
        if [ "${{ github.event.inputs.force_post }}" = "true" ]; then python src/main.py --breaking-check --force; else python src/main.py --breaking-check; fi
    - name: Run Hourly V23 FINAL Reference Perfect
      if: steps.mode.outputs.is_routine == 'true'
      run: |
        echo "V23 FINAL PERMANENT FIXES:"
        echo "1. Tabassum Begum 5x NEVER AGAIN - permanent blacklist + ALL bullets saved"
        echo "2. TSA Swimmers overuse - blacklisted"
        echo "3. Woman Married OYO 32 cards - blacklisted"
        echo "4. Reference perfect: Black #0A0A0A Gold top 12px #D4AF37 NR logo 120px Red banner #C41E2F LATEST NEWS 48px white bold warning icon Date gold 22px ENGLISH/ROMAN URDU gold 28px vertical bar Gold dot 14px White bold 26px 3+3 bullets Footer gold line verified gray credit gold"
        echo "5. Gemini API: GEMINI_API_KEY env google-generativeai fallback hardcoded specific no generic"
        echo "6. Saves ALL bullet titles 15 titles to posted_today.json to avoid 5x repeat"
        echo "7. Hourly rotation (hour*2)%len unique bullets every hour"
        echo "8. Don't junk Facebook: robust dedup FB recent 30 + last_posted 30 + today 100 + 70% overlap"
        if [ "${{ github.event.inputs.force_post }}" = "true" ]; then python src/main.py --once --force; else python src/main.py --once; fi
    - name: Save cache V23 FINAL NO TABASSUM
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          output/last_posted.json
          output/posted_today.json
        key: v23-final-no-tabassum-${{ github.run_id }}-${{ github.run_number }}
    - name: Upload artifacts V23 FINAL Reference Perfect
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v23-final-no-tabassum-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
        path: output/
        retention-days: 7
