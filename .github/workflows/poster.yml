name: National Reporter - Auto Poster (Routine + Breaking - Never Stops)

on:
  schedule:
    # Routine every 2 hours - FOREVER, never stops
    - cron: '0 */2 * * *'
    # Breaking news check every 15 minutes - immediate as it happens
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post even if duplicate'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - routine
          - breaking
  push:
    branches: [ main ]

jobs:
  post-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "Dependencies installed"

    - name: Restore last posted cache
      uses: actions/cache@v4
      with:
        path: output/last_posted.json
        key: last-posted-${{ github.run_id }}
        restore-keys: |
          last-posted-

    - name: Create output dir and check secrets
      run: |
        mkdir -p output
        echo "Checking secrets..."
        if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then
          echo "ERROR: FACEBOOK_PAGE_ID secret not set!"
          exit 1
        fi
        if [ -z "${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}" ]; then
          echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN secret not set!"
          exit 1
        fi
        echo "Secrets OK - Page ID: ${{ secrets.FACEBOOK_PAGE_ID }}"

    - name: Create .env from secrets
      run: |
        cat > .env << EOL
        FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL=gpt-4o-mini
        EOL
        chmod 600 .env
        echo "Env created"

    - name: Determine run mode
      id: mode
      run: |
        HOUR=$(date +%H)
        MINUTE=$(date +%M)
        echo "Current time: $(date) UTC | Hour: $HOUR | Minute: $MINUTE"
        if [ "${{ github.event_name }}" = "schedule" ]; then
          CRON="${{ github.event.schedule }}"
          if [ "$CRON" = "0 */2 * * *" ]; then
            echo "mode=routine" >> $GITHUB_OUTPUT
            echo "is_routine=true" >> $GITHUB_OUTPUT
            echo "Detected: ROUTINE (2h cycle) - Will post even if no brand new news to maintain forever"
          else
            echo "mode=breaking" >> $GITHUB_OUTPUT
            echo "is_routine=false" >> $GITHUB_OUTPUT
            echo "Detected: BREAKING CHECK (15min) - Will post immediately if breaking & NEW"
          fi
        else
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$INPUT_MODE" = "breaking" ]; then
            echo "mode=breaking" >> $GITHUB_OUTPUT
            echo "is_routine=false" >> $GITHUB_OUTPUT
          else
            echo "mode=routine" >> $GITHUB_OUTPUT
            echo "is_routine=true" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Run Breaking News Check (Every 15 min - Immediate if NEW breaking)
      if: steps.mode.outputs.is_routine == 'false'
      run: |
        echo "=== BREAKING NEWS CHECK (Every 15 min) ==="
        echo "Checks Munsif & Etemaad for breaking news as it happens"
        echo "Posts immediately in middle of routine 2h cycle if breaking detected"
        python src/main.py --breaking-check --force
        echo "Breaking check completed"

    - name: Run Routine Poster (Every 2 hours - FOREVER, Never Stops)
      if: steps.mode.outputs.is_routine == 'true'
      run: |
        echo "=== ROUTINE POSTER (Every 2 hours FOREVER) ==="
        echo "Maintains 2h cycle forever, never stops, set once for all"
        echo "Sources: Munsif Daily & Etemaad Daily ONLY for Urdu news"
        echo "Politics preferred, 3-5 bullets, Verified only, Large fonts, Credit: Abu Aimal & Aimal Akram"
        echo "Morning 6-11 AM: Covers ALL sections nicely"
        python src/main.py --once --force
        echo "Routine post completed - 2h cycle maintained forever"

    - name: Save last posted cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: output/last_posted.json
        key: last-posted-${{ github.run_id }}

    - name: Upload generated images and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: news-cards-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
        path: |
          output/
          *.log
        retention-days: 7

    - name: Check if posted
      if: always()
      run: |
        echo "=== Checking output ==="
        ls -lh output/ || echo "No output folder"
        cat output/*.txt 2>/dev/null | tail -20 || echo "No txt files"
        echo ""
        echo "If you see 'Successfully published! Post ID:' above, it posted to Facebook!"
        echo "Check your Page: https://www.facebook.com/239472476226069"
