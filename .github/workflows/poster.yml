name: National Reporter - Auto Poster (Routine + Breaking - No Duplicates)

on:
  schedule:
    # Routine every 2 hours
    - cron: '0 */2 * * *'
    # Breaking news check every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post even if duplicate'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      mode:
        description: 'Run mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - routine
          - breaking
  push:
    branches: [ main ]

jobs:
  post-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore last posted cache (avoid duplicates)
      uses: actions/cache@v4
      with:
        path: output/last_posted.json
        key: last-posted-${{ github.run_id }}
        restore-keys: |
          last-posted-

    - name: Create output dir
      run: mkdir -p output

    - name: Create .env from secrets
      run: |
        cat > .env << EOL
        FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL=gpt-4o-mini
        EOL
        chmod 600 .env

    - name: Determine run mode
      id: mode
      run: |
        HOUR=$(date +%H)
        MINUTE=$(date +%M)
        if [ "${{ github.event_name }}" = "schedule" ]; then
          CRON="${{ github.event.schedule }}"
          if [ "$CRON" = "0 */2 * * *" ]; then
            echo "mode=routine" >> $GITHUB_OUTPUT
            echo "is_routine=true" >> $GITHUB_OUTPUT
          else
            echo "mode=breaking" >> $GITHUB_OUTPUT
            echo "is_routine=false" >> $GITHUB_OUTPUT
          fi
        else
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$INPUT_MODE" = "breaking" ]; then
            echo "mode=breaking" >> $GITHUB_OUTPUT
            echo "is_routine=false" >> $GITHUB_OUTPUT
          elif [ "$INPUT_MODE" = "routine" ]; then
            echo "mode=routine" >> $GITHUB_OUTPUT
            echo "is_routine=true" >> $GITHUB_OUTPUT
          else
            if [ $((10#$MINUTE)) -lt 15 ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
              echo "mode=routine" >> $GITHUB_OUTPUT
              echo "is_routine=true" >> $GITHUB_OUTPUT
            else
              echo "mode=breaking" >> $GITHUB_OUTPUT
              echo "is_routine=false" >> $GITHUB_OUTPUT
            fi
          fi
        fi
        echo "Time: $(date) | Hour: $HOUR | Minute: $MINUTE | Mode: $(cat $GITHUB_OUTPUT | grep mode)"

    - name: Run Breaking News Check (Every 15 min - Immediate if breaking & NEW)
      if: steps.mode.outputs.is_routine == 'false'
      run: |
        echo "Running BREAKING NEWS check (every 15 min) - posts immediately if NEW breaking detected, avoids duplicates via FB API + cache"
        python src/main.py --breaking-check ${{ github.event.inputs.force_post == 'true' && '--force' || '' }}

    - name: Run Routine Poster (Every 2 hours - Only NEW news)
      if: steps.mode.outputs.is_routine == 'true'
      run: |
        echo "Running ROUTINE poster (every 2 hours) - Only posts if NEW verified news from Munsif/Etemaad, avoids old card duplicate"
        python src/main.py --once ${{ github.event.inputs.force_post == 'true' && '--force' || '' }}

    - name: Save last posted cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: output/last_posted.json
        key: last-posted-${{ github.run_id }}

    - name: Upload generated images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: news-cards-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
        path: output/
        retention-days: 7
